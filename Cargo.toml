[package]
name = "agentdocs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A terminal viewer for AI agent skills, rules, and docs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kwangseok-Seo/agentdocs"
readme = "README.md"
keywords = ["tui", "markdown", "viewer", "ai-agents", "skills"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
base64 = "0.22"
ignore = "0.4.30"
notify = "8.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
thiserror = "2.0.21"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.dev.package."*"]
opt-level = 3

# What the binaries people download are built with: against the defaults,
# 29% smaller on Linux and 8% on Windows, three times as long to build, and
# no slower to run. A panic still unwinds, so a `Drop` still runs.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
