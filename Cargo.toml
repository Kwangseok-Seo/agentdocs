[package]
name = "agentdocs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A terminal viewer for AI agent skills, rules, and docs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kwangseok-Seo/agentdocs"
readme = "README.md"
keywords = ["tui", "markdown", "viewer", "ai-agents", "skills"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
base64 = "0.22"
notify = "8.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.0"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.dev.package."*"]
opt-level = 3
