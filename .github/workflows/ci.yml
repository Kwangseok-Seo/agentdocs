name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # A test that cannot build its fixture — a link, a path it cannot read,
      # a shell — says SKIPPED and passes. Every one of them can be built on
      # these runners, so one that says so here has stopped testing anything.
      - name: Test
        shell: bash
        run: |
          cargo test --locked -- --nocapture 2>&1 | tee test.log
          if grep -n SKIPPED test.log; then
            echo "::error::a test skipped what it was written to test"
            exit 1
          fi

  rust-version:
    name: test (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The oldest Rust the package says it builds with, read from Cargo.toml.
      - name: Install Rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "rust-version $version"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --locked
